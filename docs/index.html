<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub Produtec</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #4a54ff;       /* Suri Blue: accent principal (links, foco, estado ativo) */
    --accent-2: #2e1de8;    /* Strong Blue: accent secundário */
    --accent-dark: #020519; /* Deep Blue */
    --marine: #000f9b;           /* Marine Blue */
    --brand-green: #00b914;
    --brand-green-alt: #25d366;
    --brand-blue: #4a54ff;
    --accent-soft: rgba(74, 84, 255, 0.14);
    --chip-bg: #e4eaf2;       /* Snow Blue: fundo dos chips de logo/ícones */

    /* fundo geral: azul-marinho, escuro mas não pesado */
    --page-bg: #141936;
    --page-text: #f7f8ff;
    --page-muted: #b2b8d6;

    /* barra lateral: um tom mais próximo do fundo, levemente distinta */
    --sidebar-bg: #10142e;
    --sidebar-text: #f7f8ff;
    --sidebar-muted: #a3a9cb;
    --sidebar-border: rgba(255, 255, 255, 0.09);

    /* cards e superfícies elevadas: nitidamente mais claras que o fundo */
    --card-bg: #1e2550;
    --card-text: #f7f8ff;
    --card-muted: #aeb4d6;
    --border: rgba(255, 255, 255, 0.12);

    --bg: #191f45;
    --overlay: rgba(6, 8, 24, 0.75);

    /* dupla tipográfica: Bricolage Grotesque nos títulos/destaques,
       Sora no resto (menu, texto corrido, botões) */
    --font-display: 'Bricolage Grotesque', 'Sora', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-body: 'Sora', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { font-size: 17px; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: radial-gradient(ellipse 1300px 800px at 15% -10%, rgba(74, 84, 255, 0.13), transparent), var(--page-bg);
    color: var(--card-text);
    line-height: 1.55;
    display: flex;
    min-height: 100vh;
  }

  /* --- Sidebar & logo --- */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    border-right: 1px solid var(--sidebar-border);
    padding: 36px 20px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .logo {
    margin-top: auto;
    padding-top: 30px;
  }
  .logo-chip {
    display: inline-flex;
    align-items: center;
    background: var(--chip-bg);
    border-radius: 12px;
    padding: 10px 14px;
  }
  .logo-chip img {
    display: block;
    height: 28px;
    width: auto;
  }
  .sidebar p.tagline {
    margin: 0 0 26px;
    color: var(--accent);
    font-family: var(--font-display);
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.6px;
    line-height: 1.1;
  }
  .nav-divider {
    height: 1px;
    background: var(--sidebar-border);
    margin: 8px 4px 12px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 11px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-left: 3px solid transparent;
    color: var(--sidebar-text);
    font-family: inherit;
    font-size: 1.08rem;
    font-weight: 500;
    padding: 13px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 2px;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .nav-item .nav-icon {
    width: 25px;
    height: 25px;
    border-radius: 7px;
    object-fit: cover;
    flex-shrink: 0;
    display: block;
  }
  .nav-item .nav-label { flex: 1; }
  .nav-item .count {
    margin-left: auto;
    background: rgba(255, 255, 255, 0.08);
    color: var(--sidebar-muted);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.84rem;
    font-weight: 600;
  }
  .nav-item:hover { background: rgba(255, 255, 255, 0.06); }
  .nav-item.active {
    background: var(--accent-soft);
    border-left-color: var(--accent);
    color: #fff;
    font-weight: 700;
  }
  .nav-item.active .count { background: rgba(74, 84, 255, 0.22); color: #fff; }

  /* --- Main content (fundo neutro e sóbrio) --- */
  .main {
    flex: 1;
    padding: 44px 48px;
    max-width: 1080px;
    background: var(--page-bg);
    color: var(--page-text);
    min-height: 100vh;
  }
  .main-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 30px;
  }
  .main-header h2 { margin: 0 0 8px; font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; letter-spacing: -0.3px; color: var(--page-text); }
  .main-header p { margin: 0; color: var(--page-muted); font-size: 1rem; }
  .hero-pill {
    display: none;
    align-items: center;
    gap: 8px;
    background: var(--accent-soft);
    border: 1px solid rgba(74, 84, 255, 0.35);
    color: var(--accent);
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .hero-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand-green-alt); }
  .main-header.home-mode {
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 48px;
  }
  .main-header.home-mode > div { display: flex; flex-direction: column; align-items: center; }
  .main-header.home-mode .hero-pill { display: inline-flex; }
  .main-header.home-mode h2 { font-size: 3rem; letter-spacing: -0.8px; }
  .main-header.home-mode p#section-subtitle { font-size: 1.15rem; max-width: 520px; }
  .search {
    width: 280px;
    max-width: 100%;
    padding: 11px 15px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--card-text);
    font-family: inherit;
    font-size: 0.95rem;
  }
  .search::placeholder { color: var(--card-muted); }
  .search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* --- Calendário de eventos (por categoria) --- */
  #cal-wrap { margin-bottom: 30px; }
  .updates-cal { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .updates-cal-calendar {
    flex: none;
    width: 296px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-head button {
    background: var(--bg);
    color: var(--card-muted);
    border: none;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .cal-head button:hover { background: var(--accent-soft); color: var(--accent); }
  .cal-month-label { font-weight: 700; font-size: 0.95rem; color: var(--card-text); }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 6px; }
  .cal-weekdays span { font-size: 0.72rem; text-align: center; color: var(--card-muted); font-weight: 600; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-day {
    position: relative;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    border-radius: 8px;
    color: var(--card-muted);
  }
  .cal-day.empty { visibility: hidden; }
  .cal-day.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .cal-day.has-update { cursor: pointer; color: var(--card-text); font-weight: 700; background: var(--accent-soft); }
  .cal-day.has-update:hover { background: var(--accent); color: #fff; }
  .cal-day.has-update.selected { background: var(--accent); color: #fff; }
  .cal-day.has-update::after {
    content: '';
    position: absolute;
    bottom: 3px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--brand-green);
  }
  .cal-day.has-update.selected::after { background: #fff; }
  .updates-cal-list { flex: 1; min-width: 240px; }
  .updates-cal-hint {
    font-size: 0.92rem;
    color: var(--card-muted);
    font-style: italic;
    padding: 26px 18px;
    text-align: center;
    background: var(--card-bg);
    border: 1px dashed var(--border);
    border-radius: 12px;
  }
  .cal-events {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px 20px;
  }
  .cal-event { padding: 18px 0; border-bottom: 1px solid var(--border); }
  .cal-event:last-child { border-bottom: none; }
  .cal-event-date { font-size: 0.82rem; color: var(--card-muted); margin-bottom: 5px; }
  .cal-event-tag {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 2px 9px;
    border: 1px solid;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .cal-event h4 { margin: 0 0 6px; font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; color: var(--card-text); }
  .cal-event h4 a { color: var(--accent); text-decoration: underline; text-decoration-color: var(--border); }
  .cal-event p { margin: 0; font-size: 0.95rem; color: var(--card-muted); line-height: 1.55; }
  @media (max-width: 720px) {
    .updates-cal-calendar { width: 100%; }
  }

  /* --- Feed de novidades (página inicial, estilo jornal) --- */
  #news-feed {
    display: none;
    flex-direction: column;
    gap: 24px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto 30px;
  }
  .news-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    text-align: left;
  }
  .news-cover { width: 100%; height: 210px; object-fit: cover; display: block; }
  .news-body { padding: 28px 30px; }
  .news-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .news-tag {
    display: inline-flex;
    align-items: center;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 4px 11px;
    border-radius: 999px;
    border: 1px solid;
  }
  .news-date { font-size: 0.85rem; color: var(--card-muted); }
  .news-card h3 { font-family: var(--font-display); font-size: 1.55rem; font-weight: 700; margin: 0 0 12px; letter-spacing: -0.2px; color: var(--card-text); }
  .news-card p.news-desc { color: var(--card-muted); font-size: 1rem; margin: 0 0 18px; line-height: 1.6; }
  .news-items {
    list-style: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 20px;
    margin: 4px 0 20px;
  }
  .news-items li { margin: 14px 0; font-size: 0.95rem; color: var(--card-muted); line-height: 1.55; }
  .news-items li b { color: var(--card-text); }
  .news-link { color: var(--accent); font-weight: 700; font-size: 0.95rem; text-decoration: none; }
  .news-link:hover { text-decoration: underline; }
  .news-empty {
    font-size: 0.95rem;
    color: var(--card-muted);
    font-style: italic;
    padding: 30px 20px;
    text-align: center;
    background: var(--card-bg);
    border: 1px dashed var(--border);
    border-radius: 12px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {
    display: block;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    color: var(--card-text);
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .card:hover {
    border-color: var(--accent);
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
  }
  .card .icon { font-size: 1.5rem; }
  .card .name { display: block; margin-top: 12px; font-size: 1.02rem; font-weight: 600; word-break: break-word; }
  .card .path { display: block; margin-top: 5px; font-size: 0.86rem; color: var(--card-muted); word-break: break-word; }
  .empty { color: var(--page-muted); font-style: italic; }

  .card.folder-card { border-color: var(--border); }
  .card.folder-card:hover { border-color: var(--accent); }
  .card.folder-card .name { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
  .card.folder-card .folder-count {
    flex-shrink: 0;
    background: var(--bg);
    color: var(--card-muted);
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
  }

  /* --- Breadcrumb de navegação por subpastas --- */
  #breadcrumb {
    display: none;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin: -10px 0 20px;
  }
  #breadcrumb button {
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--card-muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
  }
  #breadcrumb button:last-child { color: var(--accent); }
  #breadcrumb button:hover { background: var(--accent-soft); color: var(--accent); }
  #breadcrumb .crumb-sep { color: var(--card-muted); }

  /* --- Menu inicial (cards grandes por categoria) --- */
  .home-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    max-width: 940px;
    width: 100%;
  }
  .home-card {
    --card-accent: var(--accent);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 30px 26px;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    color: var(--card-text);
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  }
  .home-card:hover {
    border-color: var(--card-accent);
    box-shadow: 0 0 0 1px var(--card-accent) inset, 0 14px 34px rgba(0, 0, 0, 0.5);
    transform: translateY(-3px);
  }
  .home-card-icon {
    width: 54px;
    height: 54px;
    border-radius: 13px;
    object-fit: cover;
  }
  .home-card-name { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; }
  .home-card-desc {
    margin: -8px 0 2px;
    font-size: 1rem;
    color: var(--card-muted);
    line-height: 1.55;
  }
  .home-card-count { font-size: 0.88rem; color: var(--card-muted); }
  .home-card-link {
    margin-top: 4px;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--card-accent);
  }
  footer { margin-top: 48px; color: var(--page-muted); font-size: 0.86rem; }

  /* --- In-page preview modal --- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--overlay);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card-bg);
    color: var(--card-text);
    border-radius: 14px;
    width: min(1000px, 100%);
    height: min(85vh, 900px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55);
  }
  .modal-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .modal-header .name { font-weight: 700; flex: 1; word-break: break-word; }
  .modal-header a, .modal-header button {
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: none;
    padding: 6px 10px;
    border-radius: 7px;
  }
  .modal-header a:hover, .modal-header button:hover { background: var(--bg); }
  .modal-body { flex: 1; overflow: auto; background: var(--bg); }
  .modal-body iframe, .modal-body img {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    object-fit: contain;
  }
  .modal-body .no-preview {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--card-muted);
    text-align: center;
    padding: 24px;
  }
  .modal-body .no-preview a {
    color: #fff;
    background: var(--accent);
    padding: 10px 18px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
  }

  @media (max-width: 720px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; }
    .main { padding: 26px 20px; }
    .modal { height: 92vh; }
  }
</style>
</head>
<body>
  <div class="sidebar">
    <p class="tagline">Hub Produtec</p>
    <div id="nav"></div>
    <div class="logo">
      <div class="logo-chip">
        <img src="assets/logo-suri.png" alt="Suri Shop">
      </div>
    </div>
  </div>
  <div class="main">
    <div class="main-header" id="main-header">
      <div>
        <div class="hero-pill" id="hero-pill"><span class="dot"></span>Hub Produtec</div>
        <h2 id="section-title">Documentos</h2>
        <p id="section-subtitle"></p>
      </div>
      <input class="search" id="search" type="text" placeholder="Buscar nesta seção...">
    </div>
    <div id="cal-wrap"></div>
    <div id="news-feed"></div>
    <div id="breadcrumb"></div>
    <div class="cards" id="cards"></div>
    <footer>Atualizado automaticamente pelo GitHub Actions a cada sincronização com o Google Drive.</footer>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <span class="name" id="modal-name"></span>
        <a id="modal-open" href="#" target="_blank" rel="noopener">Abrir em nova aba</a>
        <button id="modal-close">Fechar ✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script>
    const DATA = [{"category": "Documentos", "icon": "assets/icon-documentos.png", "desc": "Guias, políticas e materiais de referência do time.", "accent": "#4a54ff", "items": [], "folders": [{"items": [{"name": "SURI-VarejOnline-guia-comercial (1).pdf", "href": "Documentos/Integração - VarejoOnline/SURI-VarejOnline-guia-comercial (1).pdf", "icon": "📄"}, {"name": "SURI-VarejOnline-padronizado.pdf", "href": "Documentos/Integração - VarejoOnline/SURI-VarejOnline-padronizado.pdf", "icon": "📄"}], "folders": [], "name": "Integração - VarejoOnline", "count": 2}, {"items": [{"name": "SURI-VTEX-padronizado.pdf", "href": "Documentos/Integração - VTEX/SURI-VTEX-padronizado.pdf", "icon": "📄"}], "folders": [], "name": "Integração - VTEX", "count": 1}, {"items": [{"name": "Configuração da integração TOTVS WinThor.pdf", "href": "Documentos/Integração - WinThor/Configuração da integração TOTVS WinThor.pdf", "icon": "📄"}, {"name": "SURI-WinThor-padronizado.pdf", "href": "Documentos/Integração - WinThor/SURI-WinThor-padronizado.pdf", "icon": "📄"}], "folders": [], "name": "Integração - WinThor", "count": 2}, {"items": [{"name": "Limite de Gastos e Volumetria (1).pdf", "href": "Documentos/Reempacotamento/Limite de Gastos e Volumetria (1).pdf", "icon": "📄"}], "folders": [], "name": "Reempacotamento", "count": 1}], "count": 6, "calendar": []}, {"category": "Requisitos", "icon": "assets/icon-requisitos.png", "desc": "Especificações e requisitos de produto para squads e stakeholders.", "accent": "#2e1de8", "items": [], "folders": [{"items": [{"name": "SURI-VarejOnline-210926-191623.pdf", "href": "Requisitos/Requisitos - Varejo Online/SURI-VarejOnline-210926-191623.pdf", "icon": "📄"}], "folders": [], "name": "Requisitos - Varejo Online", "count": 1}], "count": 1, "calendar": []}, {"category": "Deploy", "icon": "assets/icon-deploy.png", "desc": "Checklists, releases e o calendário de eventos técnicos.", "accent": "#25d366", "items": [], "folders": [], "count": 0, "calendar": [{"date": "2026-09-14", "desc": "Corrigimos uma falha no checkout de pedidos.", "link": "https://sejasuri.atlassian.net/browse/SDK-520", "title": "Checkout não exibia descontos"}, {"date": "2026-09-19", "desc": "Corrigimos um problema em que o cupom de desconto e os dados do cliente somem do link de pagamento (Shopify) depois de alguns minutos, o que podia fazer a cliente finalizar a compra sem o desconto que havia sido aplicado pela vendedora.", "link": "https://sejasuri.atlassian.net/browse/SDK-838", "title": "Cupom de desconto Shopify sumindo do carrinho depois de um tempo"}, {"date": "2026-09-19", "desc": "Corrigimos um erro que deixava o cliente preso em loop no fluxo automático, sem solução, ao responder a uma campanha muito antiga cujos dados já não existiam mais na plataforma. Agora esses casos são transbordados automaticamente para atendimento.", "link": "https://sejasuri.atlassian.net/browse/SDK-682", "title": "Campanhas muito antigas não possuíam transbordo para atendimento"}, {"date": "2026-09-19", "desc": "Corrigimos um problema em que o cliente ficava travado repetindo a mesma pergunta ao parar em uma etapa do Shop que solicitava alguma informação. Agora o fluxo de ajuda é acionado corretamente nesses casos.", "link": "https://sejasuri.atlassian.net/browse/SDK-557", "title": "Shop - [Casa Hydro] Fallback por resposta errada"}, {"date": "2026-09-19", "desc": "Ajustamos a contagem de mensagens de service para considerar apenas os eventos que realmente geram cobrança (billed = true), já que a partir de 01/10 as primeiras 1000 mensagens de service da Meta passam a ser gratuitas. Mensagens de service fora desse critério e templates de utilidade dentro da janela de 24h deixam de ser contabilizados; templates de marketing e autenticação continuam contando normalmente.", "link": "https://sejasuri.atlassian.net/browse/SDK-841", "title": "Plataforma - Contagem de mensagens de acordo com eventos da Meta"}, {"date": "2026-09-19", "desc": "Adicionamos, para lojas vTEX, uma nova configuração em Shop > Preferências > Configurações de Etapas que permite ocultar a exibição do crédito disponível do cliente durante o fluxo de compra.", "link": "https://sejasuri.atlassian.net/browse/SDK-189", "title": "Shop - [vTEX] Flag para não mostrar crédito disponível no customer credit"}, {"date": "2026-09-19", "desc": "Corrigimos a integração do app Suri Shop com a Shopify para exibir a mensagem de erro correta quando a vinculação da loja falha por falta de um canal WhatsApp (oficial, Gupshup ou CloudAPI) configurado no chatbot, evitando que o cliente ficasse sem entender o motivo da falha.", "link": "https://sejasuri.atlassian.net/browse/SDK-768", "title": "Shopify - App de integração não mostrava o motivo real da falha ao vincular loja"}, {"date": "2026-09-19", "desc": "O fluxo de rastreio de pedido agora respeita o Flow de Erro configurado para essa etapa: sempre que o cliente solicitar ajuda durante o rastreio, ele é direcionado para esse flow específico, em vez do flow de ajuda padrão do Shop usado anteriormente.", "link": "https://sejasuri.atlassian.net/browse/SDK-824", "title": "Shop - Permitir configurar flow de ajuda específico no rastreio"}, {"date": "2026-09-19", "desc": "Corrigimos a criação de listas de produtos sugeridas, que retornava vazia para clientes de providers diferentes de Suri e vTEX; agora a busca no catálogo também funciona para Shopify, Linx e Neomode. A Mercadapp segue como exceção, por depender de seleção de vendedor e método de entrega ainda não suportados pelo catálogo.", "link": "https://sejasuri.atlassian.net/browse/SDK-571", "title": "Shop - Listagem de produtos para todos os providers na criação de listas sugeridas"}]}];
    const NEWS = [{"date": "2026-09-21", "tag": "Vtex", "title": "VA/VR agora funciona na integração VTEX", "desc": "Lojas que usam bots VTEX já podem configurar métodos de pagamento customizados pra Vale Alimentação e Vale Refeição — funcionalidade solicitada pela Casas Pedro.", "image": "assets/novidades/vtex-cover.png", "items": [], "link": "https://sejasuri.atlassian.net/browse/SDK-589"}];

    const OFFICE_EXTS = ['doc', 'docx', 'ppt', 'pptx', 'xls', 'xlsx'];
    const IMAGE_EXTS = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'];

    const nav = document.getElementById('nav');
    const cardsEl = document.getElementById('cards');
    const mainHeaderEl = document.getElementById('main-header');
    const titleEl = document.getElementById('section-title');
    const subtitleEl = document.getElementById('section-subtitle');
    const searchEl = document.getElementById('search');
    const overlay = document.getElementById('modal-overlay');
    const modalName = document.getElementById('modal-name');
    const modalOpen = document.getElementById('modal-open');
    const modalBody = document.getElementById('modal-body');
    const modalClose = document.getElementById('modal-close');

    let active = 'home';
    let folderPath = []; // trilha de subpastas dentro da categoria atual (Documentos > Políticas > ...)
    const calState = {}; // estado (mês/ano/seleção) de cada calendário, por categoria
    const MONTH_NAMES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

    function pad2(n) { return n < 10 ? '0' + n : '' + n; }

    function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    }

    function formatDateLong(dateStr) {
      const p = dateStr.split('-');
      return parseInt(p[2], 10) + ' de ' + MONTH_NAMES[parseInt(p[1], 10) - 1] + ' de ' + p[0];
    }

    function ensureCalState(section) {
      if (calState[section.category]) return calState[section.category];
      const byDate = {};
      (section.calendar || []).forEach(u => { (byDate[u.date] = byDate[u.date] || []).push(u); });
      const dates = Object.keys(byDate).sort();
      let cur;
      if (dates.length) {
        const parts = dates[dates.length - 1].split('-');
        cur = { y: parseInt(parts[0], 10), m: parseInt(parts[1], 10) - 1 };
      } else {
        const now = new Date();
        cur = { y: now.getFullYear(), m: now.getMonth() };
      }
      const state = { y: cur.y, m: cur.m, selected: dates.length ? dates[dates.length - 1] : null, byDate };
      calState[section.category] = state;
      return state;
    }

    function renderCalendar(section) {
      const calWrap = document.getElementById('cal-wrap');
      const hasEvents = section.calendar && section.calendar.length;
      if (!hasEvents && section.category !== 'home') {
        calWrap.style.display = 'none';
        calWrap.innerHTML = '';
        return;
      }
      calWrap.style.display = '';
      const state = ensureCalState(section);

      calWrap.innerHTML =
        '<div class="updates-cal">' +
          '<div class="updates-cal-calendar">' +
            '<div class="cal-head">' +
              '<button type="button" data-dir="-1" aria-label="Mês anterior">&lsaquo;</button>' +
              '<div class="cal-month-label"></div>' +
              '<button type="button" data-dir="1" aria-label="Próximo mês">&rsaquo;</button>' +
            '</div>' +
            '<div class="cal-weekdays"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>' +
            '<div class="cal-grid"></div>' +
          '</div>' +
          '<div class="updates-cal-list"></div>' +
        '</div>';

      const monthLabel = calWrap.querySelector('.cal-month-label');
      const grid = calWrap.querySelector('.cal-grid');
      const listBox = calWrap.querySelector('.updates-cal-list');
      const prevBtn = calWrap.querySelector('[data-dir="-1"]');
      const nextBtn = calWrap.querySelector('[data-dir="1"]');

      function paintGrid() {
        monthLabel.textContent = capitalize(MONTH_NAMES[state.m]) + ' de ' + state.y;
        grid.innerHTML = '';
        const firstDay = new Date(state.y, state.m, 1).getDay();
        const daysInMonth = new Date(state.y, state.m + 1, 0).getDate();
        const todayStr = new Date().toISOString().slice(0, 10);
        for (let i = 0; i < firstDay; i++) {
          const empty = document.createElement('div');
          empty.className = 'cal-day empty';
          grid.appendChild(empty);
        }
        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = state.y + '-' + pad2(state.m + 1) + '-' + pad2(d);
          const cell = document.createElement('div');
          cell.className = 'cal-day';
          cell.textContent = d;
          if (dateStr === todayStr) cell.classList.add('today');
          if (state.byDate[dateStr]) {
            cell.classList.add('has-update');
            if (dateStr === state.selected) cell.classList.add('selected');
            cell.addEventListener('click', () => {
              state.selected = (state.selected === dateStr) ? null : dateStr;
              paintGrid();
              paintList();
            });
          }
          grid.appendChild(cell);
        }
      }

      function paintList() {
        if (!state.selected) {
          const hasAny = Object.keys(state.byDate).length > 0;
          listBox.innerHTML = '<div class="updates-cal-hint">' +
            (hasAny ? 'Selecione uma data destacada no calendário para ver os detalhes.' : 'Nenhum evento registrado ainda.') +
            '</div>';
          return;
        }
        const items = state.byDate[state.selected] || [];
        let out = '<div class="cal-events">';
        items.forEach((u, idx) => {
          const titleHtml = u.link
            ? '<a href="' + u.link + '" target="_blank" rel="noopener">' + escapeHtml(u.title) + '</a>'
            : escapeHtml(u.title);
          const tagHtml = u.category
            ? '<span class="cal-event-tag" style="color:' + u.categoryAccent + ';border-color:' + u.categoryAccent + '66;">' + escapeHtml(u.category) + '</span>'
            : '';
          out += '<div class="cal-event"' + (idx === items.length - 1 ? ' style="border-bottom:none;"' : '') + '>' +
            '<div class="cal-event-date">' + formatDateLong(state.selected) + '</div>' +
            tagHtml +
            '<h4>' + titleHtml + '</h4>' +
            (u.desc ? '<p>' + escapeHtml(u.desc) + '</p>' : '') +
            '</div>';
        });
        out += '</div>';
        listBox.innerHTML = out;
      }

      prevBtn.addEventListener('click', () => {
        state.m--; if (state.m < 0) { state.m = 11; state.y--; }
        paintGrid();
      });
      nextBtn.addEventListener('click', () => {
        state.m++; if (state.m > 11) { state.m = 0; state.y++; }
        paintGrid();
      });

      paintGrid();
      paintList();
    }    function extOf(name) {
      const parts = name.split('.');
      return parts.length > 1 ? parts.pop().toLowerCase() : '';
    }

    function openPreview(item) {
      const absoluteUrl = new URL(item.href, window.location.href).href;
      modalName.textContent = item.name;
      modalOpen.href = absoluteUrl;
      const ext = extOf(item.name);
      modalBody.innerHTML = '';

      if (ext === 'pdf') {
        const frame = document.createElement('iframe');
        frame.src = absoluteUrl;
        modalBody.appendChild(frame);
      } else if (IMAGE_EXTS.includes(ext)) {
        const img = document.createElement('img');
        img.src = absoluteUrl;
        modalBody.appendChild(img);
      } else if (OFFICE_EXTS.includes(ext)) {
        const frame = document.createElement('iframe');
        frame.src = 'https://docs.google.com/gview?url=' + encodeURIComponent(absoluteUrl) + '&embedded=true';
        modalBody.appendChild(frame);
      } else {
        modalBody.innerHTML = '<div class="no-preview"><p>Pré-visualização não disponível para este tipo de arquivo.</p><a href="' + absoluteUrl + '" target="_blank" rel="noopener">Abrir arquivo</a></div>';
      }
      overlay.classList.add('open');
    }

    function closePreview() {
      overlay.classList.remove('open');
      modalBody.innerHTML = '';
    }

    modalClose.addEventListener('click', closePreview);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closePreview(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePreview(); });

    function goTo(category) {
      active = category;
      folderPath = [];
      searchEl.value = '';
      render();
    }

    // Acha o nó da árvore (categoria ou uma de suas subpastas) correspondente
    // à trilha atual em folderPath. Se a trilha não bater mais (ex: pasta
    // sumiu numa sincronização), volta pra raiz da categoria.
    function getNode(section) {
      let node = section;
      for (const name of folderPath) {
        const next = (node.folders || []).find(f => f.name === name);
        if (!next) { folderPath = []; return section; }
        node = next;
      }
      return node;
    }

    function renderBreadcrumb(section) {
      const el = document.getElementById('breadcrumb');
      if (!folderPath.length) {
        el.style.display = 'none';
        el.innerHTML = '';
        return;
      }
      el.style.display = 'flex';
      let html = '<button type="button" data-idx="-1">' + escapeHtml(section.category) + '</button>';
      folderPath.forEach((name, idx) => {
        html += '<span class="crumb-sep">/</span><button type="button" data-idx="' + idx + '">' + escapeHtml(name) + '</button>';
      });
      el.innerHTML = html;
      el.querySelectorAll('button').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.idx, 10);
          folderPath = idx === -1 ? [] : folderPath.slice(0, idx + 1);
          searchEl.value = '';
          render();
        };
      });
    }

    function renderNav() {
      nav.innerHTML = '';

      const homeBtn = document.createElement('button');
      homeBtn.className = 'nav-item' + (active === 'home' ? ' active' : '');
      homeBtn.innerHTML = '<span class="nav-label">Início</span>';
      homeBtn.onclick = () => goTo('home');
      nav.appendChild(homeBtn);

      const divider = document.createElement('div');
      divider.className = 'nav-divider';
      nav.appendChild(divider);

      DATA.forEach(section => {
        const btn = document.createElement('button');
        btn.className = 'nav-item' + (section.category === active ? ' active' : '');
        btn.innerHTML = '<img class="nav-icon" src="' + section.icon + '" alt="">' +
          '<span class="nav-label">' + section.category + '</span>' +
          '<span class="count">' + section.count + '</span>';
        btn.onclick = () => goTo(section.category);
        nav.appendChild(btn);
      });
    }

    // Paleta de cores das tags do feed de novidades — escolhida por hash do
    // texto da tag, então a mesma tag (ex: "Integração") sempre cai na
    // mesma cor entre uma notícia e outra.
    const TAG_PALETTE = ['#8891ff', '#4ee6a0', '#ffb84e', '#ff8fb1', '#5fd0ff', '#c792ff'];

    function tagColor(tag) {
      if (!tag) return TAG_PALETTE[0];
      let h = 0;
      for (let i = 0; i < tag.length; i++) h = (h * 31 + tag.charCodeAt(i)) >>> 0;
      return TAG_PALETTE[h % TAG_PALETTE.length];
    }

    // Uma linha da coluna "Itens" no formato "Título — resto" (ou "Título:
    // resto") vira um item de lista com o título em negrito.
    function splitItemLine(line) {
      const seps = [' — ', ' – ', ' - ', ': '];
      for (const sep of seps) {
        const idx = line.indexOf(sep);
        if (idx > 0) {
          return { lead: line.slice(0, idx), rest: line.slice(idx + sep.length) };
        }
      }
      return { lead: '', rest: line };
    }

    function renderNewsFeed() {
      const wrap = document.getElementById('news-feed');
      wrap.style.display = 'flex';
      if (!NEWS.length) {
        wrap.innerHTML = '<div class="news-empty">Nenhuma novidade publicada ainda.</div>';
        return;
      }
      wrap.innerHTML = NEWS.map(n => {
        const color = tagColor(n.tag);
        const cover = n.image ? '<img class="news-cover" src="' + n.image + '" alt="">' : '';
        const tag = n.tag
          ? '<span class="news-tag" style="color:' + color + ';border-color:' + color + ';">' + escapeHtml(n.tag) + '</span>'
          : '<span></span>';
        const items = (n.items && n.items.length)
          ? '<ul class="news-items">' + n.items.map(line => {
              const parts = splitItemLine(line);
              return '<li>' + (parts.lead ? '<b>' + escapeHtml(parts.lead) + '</b> — ' : '') + escapeHtml(parts.rest) + '</li>';
            }).join('') + '</ul>'
          : '';
        const link = n.link ? '<a class="news-link" href="' + n.link + '" target="_blank" rel="noopener">Ler mais →</a>' : '';
        return '<article class="news-card">' + cover +
          '<div class="news-body">' +
            '<div class="news-meta">' + tag + '<span class="news-date">' + formatDateLong(n.date) + '</span></div>' +
            '<h3>' + escapeHtml(n.title) + '</h3>' +
            (n.desc ? '<p class="news-desc">' + escapeHtml(n.desc) + '</p>' : '') +
            items + link +
          '</div>' +
        '</article>';
      }).join('');
    }

    function renderHome() {
      mainHeaderEl.classList.add('home-mode');
      titleEl.textContent = 'Novidades';
      subtitleEl.textContent = 'As últimas atualizações do produto, mais recentes primeiro.';
      searchEl.style.display = 'none';
      cardsEl.style.display = 'none';
      cardsEl.innerHTML = '';

      const calWrap = document.getElementById('cal-wrap');
      calWrap.style.display = 'none';
      calWrap.innerHTML = '';

      renderNewsFeed();
    }

    function render() {
      renderNav();
      mainHeaderEl.classList.remove('home-mode');

      if (active === 'home') {
        renderHome();
        return;
      }

      document.getElementById('news-feed').style.display = 'none';
      searchEl.style.display = '';
      cardsEl.style.display = '';
      cardsEl.className = 'cards';

      const section = DATA.find(s => s.category === active);
      if (!section) return;

      const node = getNode(section);
      renderBreadcrumb(section);

      titleEl.textContent = folderPath.length ? folderPath[folderPath.length - 1] : section.category;
      subtitleEl.textContent = node.count + (node.count === 1 ? ' documento' : ' documentos');

      if (folderPath.length === 0) {
        renderCalendar(section);
      } else {
        const calWrap = document.getElementById('cal-wrap');
        calWrap.style.display = 'none';
        calWrap.innerHTML = '';
      }

      const query = searchEl.value.trim().toLowerCase();
      const folders = (node.folders || []).filter(f => f.name.toLowerCase().includes(query));
      const items = (node.items || []).filter(it => it.name.toLowerCase().includes(query));

      cardsEl.innerHTML = '';
      if (!folders.length && !items.length) {
        cardsEl.innerHTML = '<p class="empty">Nenhum documento encontrado.</p>';
        return;
      }
      folders.forEach(f => {
        const btn = document.createElement('button');
        btn.className = 'card folder-card';
        btn.innerHTML = '<span class="icon">📁</span>' +
          '<span class="name">' + escapeHtml(f.name) + '<span class="folder-count">' + f.count + '</span></span>';
        btn.onclick = () => { folderPath = folderPath.concat([f.name]); searchEl.value = ''; render(); };
        cardsEl.appendChild(btn);
      });
      items.forEach(it => {
        const btn = document.createElement('button');
        btn.className = 'card';
        btn.innerHTML = '<span class="icon">' + it.icon + '</span>' +
          '<span class="name">' + escapeHtml(it.name) + '</span>';
        btn.onclick = () => openPreview(it);
        cardsEl.appendChild(btn);
      });
    }

    searchEl.addEventListener('input', render);
    render();
  </script>
</body>
</html>
